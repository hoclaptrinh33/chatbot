apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: airc-chatbot
  labels:
    app: ui-service
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
        tier: frontend
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
        - name: ui-service
          image: registry.neovort.shop/airc-ui-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            # Các biến NEXT_PUBLIC_ được bake vào build time
            # Cần rebuild image nếu muốn đổi URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
