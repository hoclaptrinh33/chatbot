version: '3.8'

# Docker Compose cho LOCAL development
# Image names giống registry để push lên GKE sau

services:
  # 1. MongoDB
  mongodb:
    image: mongo:6.0
    container_name: airc_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - airc_network

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: airc_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - airc_network

  # 3. Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: airc_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - airc_network

  # 4. Auth Service - Image name giống registry
  auth_service:
    image: registry.neovort.shop/airc-auth-service:latest
    build:
      context: ./airc_internal_chatbot_auth
      dockerfile: Dockerfile
    container_name: airc_auth
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=airc_auth_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=AIRC_SUPER_SECRET_KEY_2024
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - DEBUG=True
    depends_on:
      - mongodb
      - redis
    networks:
      - airc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 5. Core Service - Image name giống registry
  core_service:
    image: registry.neovort.shop/airc-core-service:latest
    build:
      context: ./airc_internal_chatbot_core
      dockerfile: Dockerfile
    container_name: airc_core
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./airc_internal_chatbot_core/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=airc_chatbot
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - AUTH_SERVICE_URL=http://auth_service:8001
      - JWT_SECRET_KEY=AIRC_SUPER_SECRET_KEY_2024
      - JWT_ALGORITHM=HS256
      - DEBUG=True
      - CUDA_VISIBLE_DEVICES=-1
    volumes:
      - core_uploads:/app/uploads
      - core_faiss:/app/faiss_indexes
    depends_on:
      - mongodb
      - redis
      - qdrant
      - auth_service
    networks:
      - airc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 6. Worker Service - Dùng chung image với Core
  worker_service:
    image: registry.neovort.shop/airc-core-service:latest
    build:
      context: ./airc_internal_chatbot_core
      dockerfile: Dockerfile
    container_name: airc_worker
    restart: always
    command: python worker.py
    env_file:
      - ./airc_internal_chatbot_core/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=airc_chatbot
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CUDA_VISIBLE_DEVICES=-1
    volumes:
      - core_uploads:/app/uploads
      - core_faiss:/app/faiss_indexes
    depends_on:
      - mongodb
      - redis
      - qdrant
      - core_service
    networks:
      - airc_network

  # 7. UI Service - Image name giống registry
  ui_service:
    image: registry.neovort.shop/airc-ui-service:latest
    build:
      context: ./airc_internal_chatbot_ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_API: http://localhost:8001/api/auth
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: airc_ui
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - auth_service
      - core_service
    networks:
      - airc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  airc_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
  core_uploads:
  core_faiss:
