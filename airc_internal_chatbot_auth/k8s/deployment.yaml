apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: airc-chatbot
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
        - name: auth-service
          # Image từ Docker Registry trên jenkins.neovort.shop:5000
          image: registry.neovort.shop/airc-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: airc-shared-secrets
          env:
            - name: MONGODB_URL
              valueFrom:
                configMapKeyRef:
                  name: airc-shared-config
                  key: MONGODB_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: airc-shared-config
                  key: REDIS_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      # GCR tự xác thực qua GKE service account, không cần imagePullSecrets
