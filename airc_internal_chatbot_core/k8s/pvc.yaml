apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-uploads-pvc
  namespace: airc-chatbot
spec:
  accessModes:
    - ReadWriteOnce  # Tạm dùng RWO, cần Filestore cho RWX trong production
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard  # GKE HDD storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-faiss-pvc
  namespace: airc-chatbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # GKE HDD storage
