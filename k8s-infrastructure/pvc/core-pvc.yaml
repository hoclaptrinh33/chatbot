apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-uploads-pvc
  namespace: airc-chatbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-faiss-pvc
  namespace: airc-chatbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
