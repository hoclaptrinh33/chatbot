apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: airc-chatbot
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        - --token
        - eyJhIjoiZmY2MmM2NmM3YTY0NDU0ZDViNzg0NGEwYTA0NWI5OWEiLCJ0IjoiZTJiNDYyZmItNmIzYi00MTZmLWIzNjgtZjBjOWM1ZDI3OGRmIiwicyI6Ik16aG1ZbU0zTldJdFl6UTFNeTAwTXpRNUxUZzFaV1F0T0RReVlUSXpaV05sWkdWayJ9  # Replace with actual token
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
